<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Historial de Análisis</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="bg-light">

    <div class="container py-4">

        <!-- ENCABEZADO -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="mb-0">Historial de Análisis</h2>
                <small class="text-muted">
                    Consulta tus solicitudes y resultados clínicos
                </small>
            </div>

            <div>
                <button class="btn btn-secondary me-2" onclick="volverDashboardPaciente()">
                    Volver
                </button>

                <button class="btn btn-danger" onclick="cerrarSesion()">
                    Cerrar sesión
                </button>
            </div>
        </div>

        <!-- DATOS DEL PACIENTE -->
        <div class="card shadow p-4 mb-4">
            <h5 class="mb-3">Datos del paciente</h5>

            <p class="mb-1">
                <strong>Paciente:</strong>
                <span id="nombre_paciente">Cargando...</span>
            </p>

            <p class="mb-0">
                <strong>Correo:</strong>
                <span id="correo_paciente">Cargando...</span>
            </p>
        </div>

        <!-- HISTORIAL -->
        <div class="card shadow p-4">
            <h5 class="mb-3">Listado de análisis</h5>

            <div class="table-responsive">
                <table class="table table-bordered table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>Análisis</th>
                            <th>Fecha</th>
                            <th>Estado</th>
                            <th>Observaciones</th>
                            <th>Resultado</th>
                        </tr>
                    </thead>

                    <tbody id="tabla_historial">
                        <tr>
                            <td colspan="5" class="text-center text-muted">
                                Cargando historial...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Firebase SDK compat -->
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>

    <!-- Archivos del proyecto -->
    <script src="../js/firebase-config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/historial.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            validarRol("PACIENTE");
            cargarHistorialPaciente();
        });
    </script>

</body>
</html>
