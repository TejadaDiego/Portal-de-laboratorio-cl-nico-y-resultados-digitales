<!-- pages/usuarios.html -->

<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gestión de Usuarios</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>

<body class="bg-light">

  <div class="container py-4">

    <!-- ENCABEZADO -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h2 class="mb-0">Gestión de Usuarios</h2>
        <small class="text-muted">Administración de roles y estados de usuarios</small>
      </div>

      <div>
        <a href="dashboard_admin.html" class="btn btn-secondary me-2">
          Volver
        </a>

        <button class="btn btn-danger" onclick="cerrarSesion()">
          Cerrar sesión
        </button>
      </div>
    </div>

    <!-- RESUMEN -->
    <div class="row mb-4">

      <div class="col-md-3 mb-3">
        <div class="card shadow p-3 text-center">
          <h6>Total usuarios</h6>
          <h3 id="total_usuarios">0</h3>
        </div>
      </div>

      <div class="col-md-3 mb-3">
        <div class="card shadow p-3 text-center">
          <h6>Pacientes</h6>
          <h3 id="total_pacientes">0</h3>
        </div>
      </div>

      <div class="col-md-3 mb-3">
        <div class="card shadow p-3 text-center">
          <h6>Laboratoristas</h6>
          <h3 id="total_laboratoristas">0</h3>
        </div>
      </div>

      <div class="col-md-3 mb-3">
        <div class="card shadow p-3 text-center">
          <h6>Administradores</h6>
          <h3 id="total_administradores">0</h3>
        </div>
      </div>

    </div>

    <!-- TABLA USUARIOS -->
    <div class="card shadow p-4">
      <h5 class="mb-3">Listado de usuarios</h5>

      <div class="table-responsive">
        <table class="table table-bordered table-hover align-middle">
          <thead class="table-dark">
            <tr>
              <th>Nombres</th>
              <th>Apellidos</th>
              <th>Correo</th>
              <th>Rol</th>
              <th>Estado</th>
              <th>Cambiar rol</th>
              <th>Acción</th>
            </tr>
          </thead>

          <tbody id="tabla_usuarios">
            <tr>
              <td colspan="7" class="text-center text-muted">
                Cargando usuarios...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- FIREBASE SDK COMPAT -->
  <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>

  <!-- ARCHIVOS DEL SISTEMA -->
  <script src="../js/firebase-config.js"></script>
  <script src="../js/sounds.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/usuarios.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      validarRol("ADMINISTRADOR");
      listarUsuarios();
    });
  </script>

</body>

</html>
