<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Resultados de Análisis</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="bg-light">

    <div class="container py-4">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="mb-0">Resultados de Análisis</h2>
                <small class="text-muted">Registro de resultados clínicos</small>
            </div>

            <div>
                <button class="btn btn-secondary me-2" onclick="volverDashboardLaboratorista()">
                    Volver
                </button>

                <button class="btn btn-danger" onclick="cerrarSesion()">
                    Cerrar sesión
                </button>
            </div>
        </div>

        <div class="card shadow p-4 mb-4">
            <h5 class="mb-3">Registrar resultado</h5>

            <div class="mb-3">
                <label for="solicitud_id" class="form-label">Solicitud</label>
                <select id="solicitud_id" class="form-select">
                    <option value="">Seleccione solicitud</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="resultado_texto" class="form-label">Resultado / Observación clínica</label>
                <textarea 
                    id="resultado_texto" 
                    class="form-control" 
                    rows="4"
                    placeholder="Ejemplo: Hemoglobina dentro del rango normal..."></textarea>
            </div>

            <button class="btn btn-primary" onclick="registrarResultado()">
                Guardar resultado
            </button>
        </div>

        <div class="card shadow p-4">
            <h5 class="mb-3">Resultados registrados</h5>

            <div class="table-responsive">
                <table class="table table-bordered table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>Paciente</th>
                            <th>Análisis</th>
                            <th>Resultado</th>
                            <th>Fecha</th>
                            <th>Estado</th>
                        </tr>
                    </thead>

                    <tbody id="tabla_resultados">
                        <tr>
                            <td colspan="5" class="text-center text-muted">
                                Cargando resultados...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>

    <script src="../js/firebase-config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/resultados.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            validarRolesPermitidos(["LABORATORISTA", "ADMINISTRADOR"]);
            cargarSolicitudesParaResultado();
            listarResultados();
        });
    </script>

</body>
</html>
