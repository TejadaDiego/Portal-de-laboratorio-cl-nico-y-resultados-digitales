<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Notificaciones</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style1.css">
</head>

<body class="bg-light">

  <div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h2 class="mb-0">Notificaciones</h2>
        <small class="text-muted">Alertas y avisos del sistema</small>
      </div>

      <div>
        <button class="btn btn-secondary me-2" onclick="volverDashboard()">
          Volver
        </button>

        <button class="btn btn-danger" onclick="cerrarSesion()">
          Cerrar sesión
        </button>
      </div>
    </div>

    <div class="card shadow p-4 mb-4">
      <div class="d-flex justify-content-between align-items-center">
        <h5 class="mb-0">Resumen</h5>

        <span class="badge bg-danger" id="contador_no_leidas">
          0 no leídas
        </span>
      </div>
    </div>

    <div class="card shadow p-4">
      <h5 class="mb-3">Listado de notificaciones</h5>

      <div id="lista_notificaciones">
        <div class="text-center text-muted">
          Cargando notificaciones...
        </div>
      </div>
    </div>

  </div>

  <!-- Firebase SDK compat -->
  <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>

  <!-- Archivos del proyecto -->
  <script src="../js/firebase-config.js"></script>
  <script src="../js/sounds.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/notificaciones.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      validarSesion();
      listarNotificaciones();
    });

    function volverDashboard() {
      auth.onAuthStateChanged(async function(user) {
        if (!user) {
          window.location.href = "login.html";
          return;
        }

        const usuarioDoc = await db.collection("usuarios").doc(user.uid).get();

        if (!usuarioDoc.exists) {
          window.location.href = "login.html";
          return;
        }

        const usuario = usuarioDoc.data();

        if (usuario.rol === "ADMINISTRADOR") {
          window.location.href = "dashboard_admin.html";
        } else if (usuario.rol === "LABORATORISTA") {
          window.location.href = "dashboard_laboratorista.html";
        } else {
          window.location.href = "dashboard_paciente.html";
        }
      });
    }
  </script>

</body>

</html>
