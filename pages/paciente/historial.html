<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Historial de Análisis</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/pages/internas.css">
</head>

<body>

    <!-- SCANLINES -->
    <div class="scanline"></div>

    <main class="page-wrapper">

        <!-- ENCABEZADO -->
        <div class="page-header">
            <div>
                <h2>Historial de Análisis</h2>
                <small>
                    Consulta tus solicitudes y resultados clínicos
                </small>
            </div>

            <div class="header-actions">
                <button class="btn btn-secondary" onclick="volverDashboardPaciente()">
                    Volver
                </button>

                <button class="btn btn-danger" onclick="cerrarSesion()">
                    Cerrar sesión
                </button>
            </div>
        </div>

        <!-- DATOS DEL PACIENTE -->
        <section class="terminal-card">
            <h5>Datos del paciente</h5>

            <p>
                <strong>Paciente:</strong>
                <span id="nombre_paciente">Cargando...</span>
            </p>

            <p>
                <strong>Correo:</strong>
                <span id="correo_paciente">Cargando...</span>
            </p>
        </section>

        <!-- HISTORIAL -->
        <section class="terminal-card">
            <h5>Listado de análisis</h5>

            <div class="table-responsive">
                <table class="terminal-table">
                    <thead>
                        <tr>
                            <th>Análisis</th>
                            <th>Fecha</th>
                            <th>Estado</th>
                            <th>Observaciones</th>
                            <th>Resultado</th>
                        </tr>
                    </thead>

                    <tbody id="tabla_historial">
                        <tr>
                            <td colspan="5" class="text-center text-muted">
                                Cargando historial...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <!-- Firebase SDK compat -->
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>

    <!-- Archivos del proyecto -->
    <script src="../../js/config/firebase-config.js"></script>
    <script src="../../js/services/auth.js"></script>
    <script src="../../js/controllers/historial.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            validarRol("PACIENTE");
            cargarHistorialPaciente();
        });
    </script>

</body>
</html>
