<!-- pages/login.html COMPLETO FUNCIONAL CON FIREBASE Y GOOGLE -->

<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Iniciar Sesión</title>

  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

  <div class="scanline"></div>

  <div id="errorScreen" class="error-screen hidden">
    <div class="error-box">
      <h2>ACCESS DENIED</h2>
      <p id="errorText">INVALID CREDENTIALS</p>
    </div>
  </div>

  <main class="form-container">

    <p class="system typing">
      &gt; AUTHENTICATION REQUIRED
    </p>

    <h1 class="title">
      ACCESO AL SISTEMA
    </h1>

    <form id="loginForm" class="form">

      <label for="correo">Correo electrónico</label>
      <input
        type="email"
        id="correo"
        placeholder="ejemplo@gmail.com"
      >

      <label for="password">Contraseña</label>
      <input
        type="password"
        id="password"
        placeholder="********"
      >

      <button type="submit" class="btn">
        INICIAR SESIÓN
      </button>

      <button type="button" class="btn" onclick="iniciarConGoogle()">
        INICIAR CON GOOGLE
      </button>

    </form>

    <p id="successMessage" class="success-message hidden">
      &gt; ACCESS GRANTED
      <br>
      &gt; REDIRECTING USER...
    </p>

    <p class="link-text">
      ¿No tienes cuenta?
      <a href="registro.html">Regístrate</a>
    </p>

  </main>

  <!-- FIREBASE SDK COMPAT -->
  <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>

  <!-- ARCHIVOS DEL SISTEMA -->
  <script src="../js/firebase-config.js"></script>
  <script src="../js/sounds.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/login-validation.js"></script>

</body>

</html>
