<!-- pages/login.html COMPLETO -->

<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Iniciar Sesión</title>

  <link rel="stylesheet" href="../css/style.css">

</head>

<body>

  <!-- SCANLINES -->

  <div class="scanline"></div>

  <!-- ERROR SCREEN -->

  <div id="errorScreen" class="error-screen hidden">

    <div class="error-box">

      <h2>ACCESS DENIED</h2>

      <p id="errorText">
        INVALID CREDENTIALS
      </p>

    </div>

  </div>

  <!-- CONTENIDO -->

  <main class="form-container">

    <p class="system typing">
      > AUTHENTICATION REQUIRED
    </p>

    <h1 class="title">
      ACCESO AL SISTEMA
    </h1>

    <!-- FORM -->

    <form id="loginForm" class="form">

      <!-- CORREO -->

      <label for="correo">
        Correo electrónico
      </label>

      <input
        type="email"
        id="correo"
        placeholder="ejemplo@gmail.com"
        required
      >

      <!-- PASSWORD -->

      <label for="password">
        Contraseña
      </label>

      <input
        type="password"
        id="password"
        placeholder="********"
        required
      >

      <!-- BOTON -->

      <button type="submit" class="btn">
        INICIAR SESIÓN
      </button>

    </form>

    <!-- MENSAJE EXITO -->

    <p id="successMessage" class="success-message hidden">

      > ACCESS GRANTED
      <br>
      > REDIRECTING USER...

    </p>

    <!-- LINK -->

    <p class="link-text">

      ¿No tienes cuenta?

      <a href="registro.html">
        Regístrate
      </a>

    </p>

  </main>

  <!-- JS -->

  <script src="../js/login-validation.js"></script>

</body>

</html>
