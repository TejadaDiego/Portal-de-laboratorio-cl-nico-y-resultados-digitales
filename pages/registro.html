<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Registro de Paciente</title>

  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

  <!-- SCANLINES -->
  <div class="scanline"></div>

  <!-- TERMINAL ERROR -->
  <div id="errorScreen" class="error-screen hidden">
    <div class="error-box">
      <h2>SYSTEM ERROR</h2>

      <p id="errorText">
        INVALID DATA DETECTED
      </p>
    </div>
  </div>

  <!-- CONTENIDO -->
  <main class="form-container">

    <p class="system typing">
      &gt; NEW PATIENT REGISTRATION
    </p>

    <h1 class="title">
      REGISTRO DE PACIENTE
    </h1>

    <form id="registroForm" class="form">

      <label for="dni">
        DNI
      </label>

      <input
        type="text"
        id="dni"
        placeholder="12345678"
        required
      >

      <label for="nombres">
        Nombres
      </label>

      <input
        type="text"
        id="nombres"
        placeholder="Juan"
        required
      >

      <label for="apellidos">
        Apellidos
      </label>

      <input
        type="text"
        id="apellidos"
        placeholder="Pérez"
        required
      >

      <label for="correo">
        Correo electrónico
      </label>

      <input
        type="email"
        id="correo"
        placeholder="ejemplo@gmail.com"
        required
      >

      <label for="password">
        Contraseña
      </label>

      <input
        type="password"
        id="password"
        placeholder="Mínimo 6 caracteres"
        required
      >

      <label for="telefono">
        Teléfono
      </label>

      <input
        type="text"
        id="telefono"
        placeholder="999999999"
        required
      >

      <label for="fecha_nacimiento">
        Fecha de nacimiento
      </label>

      <input
        type="date"
        id="fecha_nacimiento"
        required
      >

      <label for="direccion">
        Dirección
      </label>

      <input
        type="text"
        id="direccion"
        placeholder="Av. Ejemplo 123"
        required
      >

      <button type="submit" class="btn">
        REGISTRAR PACIENTE
      </button>

    </form>

    <p id="successMessage" class="success-message hidden">
      &gt; VALIDATION SUCCESSFUL
      <br>
      &gt; PATIENT REGISTERED
    </p>

    <p class="link-text">
      ¿Ya tienes cuenta?

      <a href="login.html">
        Iniciar sesión
      </a>
    </p>

  </main>

<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>

<script src="../js/firebase-config.js"></script>
<script src="../js/sounds.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/registro-validation.js"></script>

</body>

</html>
