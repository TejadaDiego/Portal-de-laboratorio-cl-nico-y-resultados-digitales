<!-- pages/registro.html COMPLETO -->

<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Registro de Paciente</title>

  <link rel="stylesheet" href="../css/style.css">

</head>

<body>

  <!-- SCANLINES -->

  <div class="scanline"></div>

  <!-- TERMINAL ERROR -->

  <div id="errorScreen" class="error-screen hidden">

    <div class="error-box">

      <h2>SYSTEM ERROR</h2>

      <p id="errorText">
        INVALID DATA DETECTED
      </p>

    </div>

  </div>

  <!-- CONTENIDO -->

  <main class="form-container">

    <p class="system typing">
      > NEW PATIENT REGISTRATION
    </p>

    <h1 class="title">
      REGISTRO DE PACIENTE
    </h1>

    <form id="registroForm" class="form">

      <!-- DNI -->

      <label for="dni">
        DNI
      </label>

      <input
        type="text"
        id="dni"
        placeholder="12345678"
        required
      >

      <!-- NOMBRES -->

      <label for="nombres">
        Nombres
      </label>

      <input
        type="text"
        id="nombres"
        placeholder="Juan"
        required
      >

      <!-- APELLIDOS -->

      <label for="apellidos">
        Apellidos
      </label>

      <input
        type="text"
        id="apellidos"
        placeholder="Pérez"
        required
      >

      <!-- CORREO -->

      <label for="correo">
        Correo electrónico
      </label>

      <input
        type="email"
        id="correo"
        placeholder="ejemplo@gmail.com"
        required
      >

      <!-- PASSWORD -->

      <label for="password">
        Contraseña
      </label>

      <input
        type="password"
        id="password"
        placeholder="********"
        required
      >

      <!-- TELEFONO -->

      <label for="telefono">
        Teléfono
      </label>

      <input
        type="text"
        id="telefono"
        placeholder="999999999"
        required
      >

      <!-- FECHA -->

      <label for="fechaNacimiento">
        Fecha de nacimiento
      </label>

      <input
        type="date"
        id="fechaNacimiento"
        required
      >

      <!-- DIRECCION -->

      <label for="direccion">
        Dirección
      </label>

      <input
        type="text"
        id="direccion"
        placeholder="Av. Ejemplo 123"
        required
      >

      <!-- BOTON -->

      <button type="submit" class="btn">
        REGISTRAR PACIENTE
      </button>

    </form>

    <!-- MENSAJE -->

    <p id="successMessage" class="success-message hidden">
      > VALIDATION SUCCESSFUL
      <br>
      > READY FOR FIREBASE CONNECTION
    </p>

    <!-- LINK -->

    <p class="link-text">

      ¿Ya tienes cuenta?

      <a href="login.html">
        Iniciar sesión
      </a>

    </p>

  </main>

  <!-- JS -->

  <script src="../js/registro-validation.js"></script>

</body>

</html>
