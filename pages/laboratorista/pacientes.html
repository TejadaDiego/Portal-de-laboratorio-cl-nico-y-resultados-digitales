<!-- pages/pacientes.html -->

<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gestión de Pacientes</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../css/pages/internas.css">
</head>

<body class="bg-light">

  <div class="container py-4">

    <!-- ENCABEZADO -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h2 class="mb-0">Gestión de Pacientes</h2>
        <small class="text-muted">Registro y administración de pacientes</small>
      </div>

      <div>
        <button class="btn btn-secondary me-2" onclick="volverDashboard()">
          Volver
        </button>

        <button class="btn btn-danger" onclick="cerrarSesion()">
          Cerrar sesión
        </button>
      </div>
    </div>

    <!-- FORMULARIO PACIENTE -->
    <div class="card shadow p-4 mb-4">
      <h5 class="mb-3">Registrar / Editar Paciente</h5>

      <input type="hidden" id="paciente_id">

      <div class="row">

        <div class="col-md-4 mb-3">
          <label for="dni" class="form-label">DNI</label>
          <input type="text" id="dni" class="form-control" placeholder="12345678">
        </div>

        <div class="col-md-4 mb-3">
          <label for="nombres" class="form-label">Nombres</label>
          <input type="text" id="nombres" class="form-control" placeholder="Juan">
        </div>

        <div class="col-md-4 mb-3">
          <label for="apellidos" class="form-label">Apellidos</label>
          <input type="text" id="apellidos" class="form-control" placeholder="Pérez">
        </div>

      </div>

      <div class="row">

        <div class="col-md-4 mb-3">
          <label for="fecha_nacimiento" class="form-label">Fecha de nacimiento</label>
          <input type="date" id="fecha_nacimiento" class="form-control">
        </div>

        <div class="col-md-4 mb-3">
          <label for="telefono" class="form-label">Teléfono</label>
          <input type="text" id="telefono" class="form-control" placeholder="999999999">
        </div>

        <div class="col-md-4 mb-3">
          <label for="correo" class="form-label">Correo</label>
          <input type="email" id="correo" class="form-control" placeholder="correo@gmail.com">
        </div>

      </div>

      <div class="mb-3">
        <label for="direccion" class="form-label">Dirección</label>
        <input type="text" id="direccion" class="form-control" placeholder="Av. Ejemplo 123">
      </div>

      <div>
        <button class="btn btn-primary" onclick="guardarPaciente()">
          Guardar paciente
        </button>

        <button class="btn btn-secondary" onclick="limpiarFormularioPaciente()">
          Limpiar
        </button>
      </div>
    </div>

    <!-- TABLA PACIENTES -->
    <div class="card shadow p-4">
      <h5 class="mb-3">Listado de pacientes</h5>

      <div class="table-responsive">
        <table class="table table-bordered table-hover align-middle">
          <thead class="table-dark">
            <tr>
              <th>DNI</th>
              <th>Paciente</th>
              <th>Correo</th>
              <th>Teléfono</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>

          <tbody id="tabla_pacientes">
            <tr>
              <td colspan="6" class="text-center text-muted">
                Cargando pacientes...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- FIREBASE SDK COMPAT -->
  <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>

  <!-- ARCHIVOS DEL SISTEMA -->
  <script src="../../js/config/firebase-config.js"></script>
  <script src="../../js/utils/sounds.js"></script>
  <script src="../../js/services/auth.js"></script>
  <script src="../../js/controllers/pacientes.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      validarRolesPermitidos(["LABORATORISTA", "ADMINISTRADOR"]);
      listarPacientes();
    });

    function volverDashboard() {
      auth.onAuthStateChanged(async function(user) {
        if (!user) {
          window.location.href = "../auth/login.html";
          return;
        }

        const usuarioDoc = await db.collection("usuarios").doc(user.uid).get();

        if (!usuarioDoc.exists) {
          window.location.href = "../auth/login.html";
          return;
        }

        const usuario = usuarioDoc.data();

        if (usuario.rol === "ADMINISTRADOR") {
          window.location.href = "../administrador/dashboard_admin.html";
        } else if (usuario.rol === "LABORATORISTA") {
          window.location.href = "dashboard_laboratorista.html";
        } else {
          window.location.href = "../paciente/dashboard_paciente.html";
        }
      });
    }
  </script>

</body>

</html>
