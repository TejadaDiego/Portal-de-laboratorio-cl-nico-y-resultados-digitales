<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Resultados de Análisis</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/pages/internas.css">
</head>

<body>

    <!-- SCANLINES -->
    <div class="scanline"></div>

    <main class="page-wrapper">

        <!-- ENCABEZADO -->
        <div class="page-header">
            <div>
                <h2>Resultados de Análisis</h2>
                <small>Registro de resultados clínicos</small>
            </div>

            <div class="header-actions">
                <button class="btn btn-secondary" onclick="volverDashboardLaboratorista()">
                    Volver
                </button>

                <button class="btn btn-danger" onclick="cerrarSesion()">
                    Cerrar sesión
                </button>
            </div>
        </div>

        <!-- REGISTRAR RESULTADO -->
        <section class="terminal-card">
            <h5>Registrar resultado</h5>

            <div class="mb-3 text-start">
                <label for="solicitud_id" class="terminal-label">Solicitud</label>
                <select id="solicitud_id" class="form-select terminal-select">
                    <option value="">Seleccione solicitud</option>
                </select>
            </div>

            <div class="mb-3 text-start">
                <label for="resultado_texto" class="terminal-label">
                    Resultado / Observación clínica
                </label>

                <textarea
                    id="resultado_texto"
                    class="form-control terminal-textarea"
                    rows="4"
                    placeholder="Ejemplo: Hemoglobina dentro del rango normal..."></textarea>
            </div>

            <button class="btn btn-primary" onclick="registrarResultado()">
                Guardar resultado
            </button>
        </section>

        <!-- RESULTADOS REGISTRADOS -->
        <section class="terminal-card">
            <h5>Resultados registrados</h5>

            <div class="table-responsive">
                <table class="terminal-table">
                    <thead>
                        <tr>
                            <th>Paciente</th>
                            <th>Análisis</th>
                            <th>Resultado</th>
                            <th>Fecha</th>
                            <th>Estado</th>
                        </tr>
                    </thead>

                    <tbody id="tabla_resultados">
                        <tr>
                            <td colspan="5" class="text-center text-muted">
                                Cargando resultados...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <!-- Firebase SDK compat -->
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>

    <!-- Archivos del proyecto -->
    <script src="../../js/config/firebase-config.js"></script>
    <script src="../../js/services/auth.js"></script>
    <script src="../../js/controllers/resultados.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            validarRolesPermitidos(["LABORATORISTA", "ADMINISTRADOR"]);
            cargarSolicitudesParaResultado();
            listarResultados();
        });
    </script>

</body>
</html>
